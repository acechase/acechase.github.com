<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doomsday Tunnels</title>
<meta name="description" content="A wireframe tunnel flyer for phones. Steer, shoot and boost through twisting 3D tunnels before the countdown hits zero.">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomsday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syncopate:wght@700&display=swap">
<style>
/* Layout: one full-bleed canvas. The game always plays landscape and draws its own HUD and thumb controls. */
:root{
  color-scheme: dark;
  --void:#07060f; --ink:#e8f1ff; --dim:#8a94b3;
  --warn:#ff5a3c; --gate:#ffe14a; --pick:#ffffff;
  --s1:#35d9ff; --s2:#b07cff; --s3:#4dffa6; --s4:#ff6ad5; --s5:#5b8cff;
  --display:"Syncopate","Arial Black",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--mono);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}

html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--void)}
</style>
</head>
<body>
<h1 class="sr">Doomsday Tunnels</h1>
<p class="sr">A wireframe tunnel flying game. Steer through the tunnel, dodge red walls, shoot yellow gates and mines, collect white cells, and reach the end of each sector before the countdown hits zero.</p>
<canvas id="game" tabindex="0" aria-label="Doomsday Tunnels game screen"></canvas>
<div id="probe"></div>
<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const probe = document.getElementById('probe');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = { void: tok('--void'), ink: tok('--ink'), dim: tok('--dim'), warn: tok('--warn'),
  gate: tok('--gate'), pick: tok('--pick'), sectors: [1,2,3,4,5].map(i => tok('--s' + i)) };
const FONT_D = tok('--display'), FONT_M = tok('--mono');

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- view ---------- */
const HW = 1.3, HH = 0.85, SEG = 2, NR = 38, NEAR = 0.35, DEPTH = NR * SEG;

let touchUI = matchMedia('(pointer: coarse)').matches;

  boostBtn.x = W - padR - 186 * u; boostBtn.y = H - 54 * u; boostBtn.r = 34 * u;

}
function toLogical(e) {

const sfx = {
  laser: () => tone('square', 900, 180, 0.09, 0.07),
  boom:  () => { noise(0.35, 0.5, 900); tone('sawtooth', 140, 40, 0.3, 0.2); },
  hit:   () => { noise(0.25, 0.6, 500); tone('sawtooth', 110, 35, 0.25, 0.3); },
  tink:  () => tone('triangle', 1400, 900, 0.05, 0.12),
  pick:  () => { tone('sine', 660, 660, 0.08, 0.2); tone('sine', 990, 990, 0.12, 0.2, 0.08); },
  scrape:() => noise(0.08, 0.2, 2500),
  clear: () => [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.14, 0.1, i * 0.11)),

function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

/* ---------- levels ---------- */

let lv = null;

/* ---------- state ---------- */

let pz = 0, speed = 0, rx = 0, ry = 0, vx = 0, vy = 0, roll = 0, objs = [];
let fireCd = 0, gunSide = 1, flash = 0, flashCol = C.warn, shake = 0, scrapeCd = 0, lastBeep = 0;
const bullets = [], parts = [], popups = [];

/* ---------- input ---------- */
const keys = {};
const stick = { id: null, ax: 0, ay: 0, x: 0, y: 0 };

  const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
  const boost = keys.ShiftLeft || keys.ShiftRight || boostId !== null;
  const firing = keys.Space || fireId !== null;

  const target = lv.v0 * (boost ? 1.6 : 1);
  speed += (target - speed) * Math.min(1, dt * (speed < target ? 1.3 : 2.5));
  const S = 3.6, kk = Math.min(1, dt * 9);
  vx += (ix * S - vx) * kk; vy += (iy * S - vy) * kk;

  const dfy = clamp((cyAt(pz + 0.5) - cyAt(pz - 0.5)) * speed * 0.3, -3, 3);

  const mx = HW - 0.16, my = HH - 0.14; let sx = 0, sy = 0;

/* ---------- world rendering ---------- */

function drawWorld() {

/* ---------- HUD, controls, screens ---------- */
function txt(s, x, y, font, size, color, align) {
  ctx.font = (font === FONT_D ? '700 ' : '') + size + 'px ' + font;
  ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.fillText(s, x, y);
}
function ringBtn(b, label, on, size) {
  ctx.globalAlpha = on ? 0.3 : 0.1; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
  ctx.globalAlpha = on ? 1 : 0.6; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5 * u; ctx.stroke();
  ctx.textBaseline = 'middle'; txt(label, b.x, b.y, FONT_M, size * u, C.ink, 'center');
  ctx.globalAlpha = 1;
}
function drawHUD() {
  const m = 14 * u, x0 = padL + m;
  ringBtn(muteBtn, muted ? 'MUTE' : 'SND', !muted, 11);
  if (state === 'title' || state === 'clear') return;
  ringBtn(pauseBtn, paused ? '>' : 'II', paused, 14);
  ctx.textBaseline = 'top';
  txt('SECTOR ' + String(level).padStart(2, '0'), x0, m, FONT_M, 12 * u, C.dim);
  txt(String(Math.floor(score)).padStart(6, '0'), x0, m + 15 * u, FONT_M, 21 * u, C.ink);
  txt('SHIELD', x0, m + 43 * u, FONT_M, 11 * u, C.dim);

  ctx.strokeStyle = low ? C.warn : C.ink; ctx.lineWidth = u; ctx.globalAlpha = 0.8; ctx.strokeRect(x0, by, bw, bh);

  txt('DETONATION IN', W / 2, m, FONT_M, 11 * u, urgent ? C.warn : C.dim, 'center');
  txt(Math.max(0, time).toFixed(1), W / 2, m + 14 * u, FONT_D, 26 * u, blink ? C.warn : C.ink, 'center');

  ctx.fillStyle = C.ink; ctx.fillRect(W / 2 - pw / 2 + pw * prog - u, py - 4 * u, 2 * u, 10 * u);

  ctx.textBaseline = 'middle';
  for (const p of popups) { ctx.globalAlpha = clamp(1 - p.t / 1.2, 0, 1); txt(p.s, W / 2, H * 0.3 - p.t * 34 * u, FONT_M, 18 * u, C.pick, 'center'); }

  ctx.beginPath(); ctx.arc(ax, ay, R, 0, 6.283); ctx.stroke();

function legend(y, size) {

  ctx.font = size + 'px ' + FONT_M; const gap = size * 1.6;

  let x = W / 2 - total / 2;

}
function drawOverlay() {
  if (state === 'play' && !paused) return;

  ctx.textBaseline = 'middle';

  const go = touchUI ? 'TAP' : 'PRESS SPACE';

    txt('Reach the end of each sector before the countdown hits zero.', cx, cy + 6 * u, FONT_M, Math.min(15 * u, W * 0.026), C.ink, 'center');
    legend(cy + 36 * u, Math.min(13 * u, W * 0.021));

      cx, cy + 62 * u, FONT_M, Math.min(12 * u, W * 0.02), C.dim, 'center');
    if (blink) txt(go + ' TO LAUNCH', cx, cy + 104 * u, FONT_D, 15 * u, C.ink, 'center');
    if (best > 0) txt('BEST ' + String(best).padStart(6, '0'), cx, cy + 136 * u, FONT_M, 13 * u, C.dim, 'center');

/* ---------- loop and boot ---------- */
let last = 0;
function frame(t) {

})();
