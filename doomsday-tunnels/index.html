<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syncopate:wght@700&display=swap">
<style>

  --display:"Syncopate","Arial Black",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--mono);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#tune{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--void) 80%,transparent)}
#tune.rot{transform:translate(-50%,-50%) rotate(90deg)}
.tcard{container-type:inline-size;width:min(660px,100%);max-height:100%;overflow:auto;box-sizing:border-box;
  border:1px solid var(--dim);background:var(--void);padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.thead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.thead h2{margin:0;font:700 14px var(--display);letter-spacing:.08em}
.thead p{margin:0;color:var(--dim);font-size:12px}
#tune-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
@container (max-width:430px){#tune-rows{grid-template-columns:minmax(0,1fr)}}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;font-size:13px}
.thint{grid-column:1/-1;color:var(--dim);font-size:11px}
.trow input{grid-column:1/-1;width:100%;height:28px;margin:0;accent-color:var(--s1)}
.tval{font-variant-numeric:tabular-nums;color:var(--s1)}
.tfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.tfoot button{font:inherit;font-size:13px;letter-spacing:.06em;color:var(--ink);background:transparent;
  border:1px solid var(--ink);padding:9px 18px;min-height:40px;cursor:pointer}
#tune-done{background:var(--ink);color:var(--void)}
.tfoot button:focus-visible,.trow input:focus-visible{outline:2px solid var(--gate);outline-offset:2px}

html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--void)}
</style>
</head>
<body>
<h1 class="sr">Doomsday Tunnels</h1>
<p class="sr">A wireframe tunnel flying game. Steer through the tunnel, dodge red walls, shoot yellow gates and mines, collect white cells, and reach the end of each sector before the countdown hits zero.</p>
<canvas id="game" tabindex="0" aria-label="Doomsday Tunnels game screen"></canvas>
<div id="probe"></div>
<div id="tune" hidden>
  <div class="tcard" role="dialog" aria-modal="true" aria-labelledby="tune-title">
    <div class="thead"><h2 id="tune-title">TUNE THE FEEL</h2><p>Changes apply right away and are saved on this device.</p></div>
    <div id="tune-rows"></div>
    <div class="tfoot"><button type="button" id="tune-reset">Reset to defaults</button><button type="button" id="tune-done">Done</button></div>
  </div>
</div>
<script>

}

  hit:   () => { noise(0.25, 0.6, 500); tone('sawtooth', 110, 35, 0.25, 0.3); },
  tink:  () => tone('triangle', 1400, 900, 0.05, 0.12),

/* ---------- levels ---------- */

/* ---------- state ---------- */

    const p = projTo(tmp, b.x, b.y, b.z), x1 = p.x, y1 = p.y, w = clamp(0.045 * p.s, 1.6 * u, 6 * u); projTo(tmp, b.x, b.y, b.z + 2.6);
    const al = Math.max(0.3, fog(d1));
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(tmp.x, tmp.y);
    ctx.globalAlpha = al * 0.5; ctx.strokeStyle = rgb(lv.pal.line); ctx.lineWidth = w * 2.6; ctx.stroke();
    ctx.globalAlpha = al; ctx.strokeStyle = C.ink; ctx.lineWidth = w * 0.8; ctx.stroke();
  }
  // sparks and shockwaves
  ctx.lineWidth = 1.8 * u;
  for (const p of parts) {
    ctx.globalAlpha = Math.min(1, p.life * 2.2); ctx.strokeStyle = p.col;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke();
  }
  for (const k of shocks) {
    const t = k.life / k.max;
    ctx.globalAlpha = t * 0.8; ctx.strokeStyle = k.col; ctx.lineWidth = (1 + 5 * t) * u;
    ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, 6.283); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (state === 'play') {
    const p = projTo(tmp, rx, ry - 0.09, pz + 26), g = 9 * u;
    ctx.beginPath();
    ctx.moveTo(p.x - g * 1.8, p.y); ctx.lineTo(p.x - g * 0.6, p.y); ctx.moveTo(p.x + g * 0.6, p.y); ctx.lineTo(p.x + g * 1.8, p.y);
    ctx.moveTo(p.x, p.y - g * 1.8); ctx.lineTo(p.x, p.y - g * 0.6); ctx.moveTo(p.x, p.y + g * 0.6); ctx.lineTo(p.x, p.y + g * 1.8);
    ctx.globalAlpha = 0.6; ctx.strokeStyle = C.void; ctx.lineWidth = 3.4 * u; ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5 * u; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- HUD, controls, screens ---------- */
function txt(s, x, y, font, size, color, align) {
  ctx.font = (font === FONT_D ? '700 ' : '') + size + 'px ' + font;
  ctx.textAlign = align || 'left';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2.5, size * 0.22); ctx.strokeStyle = C.void; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function ringBtn(b, label, on, size) {
  ctx.globalAlpha = on ? 0.4 : 0.45; ctx.fillStyle = on ? C.ink : C.void; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fill();
  ctx.globalAlpha = on ? 1 : 0.8; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5 * u; ctx.stroke();
  ctx.textBaseline = 'middle'; txt(label, b.x, b.y, FONT_M, size * u, C.ink, 'center');
  ctx.globalAlpha = 1;
}
function drawHUD() {
  const m = 14 * u, x0 = padL + m;
  ringBtn(muteBtn, muted ? 'MUTE' : 'SND', !muted, 11);
  if (state !== 'play' || paused) ringBtn(tuneBtn, 'TUNE', false, 10);
  if (state === 'title' || state === 'clear') return;
  ringBtn(pauseBtn, paused ? '>' : 'II', paused, 14);
  ctx.textBaseline = 'top';
  txt('SECTOR ' + String(level).padStart(2, '0'), x0, m, FONT_M, 12 * u, C.dim);
  txt(String(Math.floor(score)).padStart(6, '0'), x0, m + 15 * u, FONT_M, 21 * u, C.ink);
  txt('SHIELD', x0, m + 43 * u, FONT_M, 11 * u, C.dim);
  const bw = 112 * u, bh = 7 * u, by = m + 58 * u, low = shield < 30;
  ctx.globalAlpha = 0.55; ctx.fillStyle = C.void; ctx.fillRect(x0, by, bw, bh);
  ctx.strokeStyle = low ? C.warn : C.ink; ctx.lineWidth = u; ctx.globalAlpha = 0.9; ctx.strokeRect(x0, by, bw, bh);
  ctx.globalAlpha = 1; ctx.fillStyle = low ? C.warn : lv.color; ctx.fillRect(x0, by, bw * clamp(shield / 100, 0, 1), bh);

  const urgent = time < 10, blink = urgent && (tNow * 4 % 1) < 0.5;
  txt('DETONATION IN', W / 2, m, FONT_M, 11 * u, urgent ? C.warn : C.dim, 'center');
  txt(Math.max(0, time).toFixed(1), W / 2, m + 14 * u, FONT_D, 26 * u, blink ? C.warn : C.ink, 'center');
  const pw = 170 * u, py = m + 48 * u, prog = clamp(pz / lv.L, 0, 1);
  ctx.globalAlpha = 0.45; ctx.fillStyle = C.ink; ctx.fillRect(W / 2 - pw / 2, py, pw, 2 * u);
  ctx.globalAlpha = 1; ctx.fillStyle = lv.color; ctx.fillRect(W / 2 - pw / 2, py - u, pw * prog, 4 * u);
  ctx.fillStyle = C.ink; ctx.fillRect(W / 2 - pw / 2 + pw * prog - u, py - 4 * u, 2 * u, 10 * u);
  ctx.textBaseline = 'bottom';
  txt('VEL ' + String(Math.round(speed * 12)).padStart(3, '0'), W / 2, H - 10 * u, FONT_M, 12 * u, C.dim, 'center');
  ctx.textBaseline = 'middle';
  for (const p of popups) { ctx.globalAlpha = clamp(1 - p.t / 1.2, 0, 1); txt(p.s, W / 2, H * 0.3 - p.t * 34 * u, FONT_M, 18 * u, C.pick, 'center'); }
  ctx.globalAlpha = 1;
}
function drawControls() {
  if (!touchUI || state !== 'play') return;
  const R = STICK_R * u, on = stick.id !== null;
  const ax = on ? stick.ax : padL + 112 * u, ay = on ? stick.ay : H - 104 * u;
  ctx.beginPath(); ctx.arc(ax, ay, R, 0, 6.283);
  ctx.globalAlpha = 0.28; ctx.fillStyle = C.void; ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5 * u; ctx.globalAlpha = on ? 0.8 : 0.55; ctx.stroke();
  ctx.globalAlpha = on ? 0.55 : 0.22; ctx.fillStyle = C.ink;
  ctx.beginPath(); ctx.arc(ax + stick.x * R, ay + stick.y * R, 22 * u, 0, 6.283); ctx.fill();
  if (!on) { ctx.globalAlpha = 0.7; ctx.textBaseline = 'middle'; txt('STEER', ax, ay, FONT_M, 11 * u, C.ink, 'center'); }
  ctx.globalAlpha = 1;
  ringBtn(fireBtn, 'FIRE', fireId !== null, 15);
  ringBtn(boostBtn, 'BOOST', boostId !== null, 12);
}
function legend(y, size) {
  const items = [['RED WALLS: DODGE', C.warn], ['YELLOW: SHOOT', C.gate], ['WHITE CELLS: COLLECT', C.pick]];
  ctx.font = size + 'px ' + FONT_M; const gap = size * 1.6;
  let total = -gap; for (const it of items) total += ctx.measureText(it[0]).width + gap;
  let x = W / 2 - total / 2;
  for (const it of items) { txt(it[0], x, y, FONT_M, size, it[1], 'left'); x += ctx.measureText(it[0]).width + gap; }
}
function drawOverlay() {
  if (state === 'play' && !paused) return;
  ctx.globalAlpha = state === 'title' ? 0.4 : 0.55; ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  ctx.textBaseline = 'middle';
  const cx = W / 2, cy = H / 2, big = Math.min(44 * u, W * 0.06), blink = (tNow * 1.6 % 1) < 0.65;
  const go = touchUI ? 'TAP' : 'PRESS SPACE';
  if (state === 'play') { txt('PAUSED', cx, cy - 10 * u, FONT_D, big * 0.8, C.ink, 'center'); txt(go + ' TO RESUME', cx, cy + 34 * u, FONT_M, 15 * u, C.dim, 'center'); return; }
  if (state === 'title') {
    txt('DOOMSDAY', cx, cy - 92 * u, FONT_D, big, C.ink, 'center');
    txt('TUNNELS', cx, cy - 92 * u + big * 1.15, FONT_D, big, lv.color, 'center');
    txt('Reach the end of each sector before the countdown hits zero.', cx, cy + 6 * u, FONT_M, Math.min(15 * u, W * 0.026), C.ink, 'center');
    legend(cy + 36 * u, Math.min(13 * u, W * 0.021));
    txt(touchUI ? 'LEFT THUMB STEERS  /  RIGHT THUMB FIRES  /  BOOST FOR SPEED' : 'ARROWS OR WASD STEER  /  SPACE FIRES  /  SHIFT BOOSTS  /  F FULL SCREEN',
      cx, cy + 62 * u, FONT_M, Math.min(12 * u, W * 0.02), C.dim, 'center');
    if (blink) txt(go + ' TO LAUNCH', cx, cy + 104 * u, FONT_D, 15 * u, C.ink, 'center');
    if (best > 0) txt('BEST ' + String(best).padStart(6, '0'), cx, cy + 136 * u, FONT_M, 13 * u, C.dim, 'center');
    if (rot) txt('TURN YOUR PHONE SIDEWAYS', cx, cy - 150 * u, FONT_M, 12 * u, C.gate, 'center');
  } else if (state === 'clear') {
    txt('SECTOR ' + String(bonus.n).padStart(2, '0') + ' CLEAR', cx, cy - 70 * u, FONT_D, big * 0.75, C.ink, 'center');
    txt('TIME BONUS    +' + bonus.tb, cx, cy - 18 * u, FONT_M, 16 * u, C.ink, 'center');
    txt('SHIELD BONUS  +' + bonus.sb, cx, cy + 6 * u, FONT_M, 16 * u, C.ink, 'center');
    txt('SCORE ' + String(Math.floor(score)).padStart(6, '0'), cx, cy + 36 * u, FONT_M, 16 * u, lv.color, 'center');
    if (blink) txt(go + ' FOR SECTOR ' + String(level).padStart(2, '0'), cx, cy + 86 * u, FONT_D, 14 * u, C.ink, 'center');
  } else {
    txt(deadWhy, cx, cy - 64 * u, FONT_D, big * 0.8, C.warn, 'center');
    txt('SECTOR ' + String(level).padStart(2, '0') + '   SCORE ' + String(Math.floor(score)).padStart(6, '0'), cx, cy - 8 * u, FONT_M, 17 * u, C.ink, 'center');
    txt('BEST ' + String(best).padStart(6, '0'), cx, cy + 18 * u, FONT_M, 14 * u, C.dim, 'center');
    if (blink && stateT > 0.6) txt(go + ' TO RETRY', cx, cy + 74 * u, FONT_D, 15 * u, C.ink, 'center');
  }
}
function render() {
  baseTransform();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = lv ? rgb(lv.pal.haze) : C.void; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const k = reduceMotion ? 0 : shake * 12 * u * TUNE.sway;
  ctx.translate(W / 2 + (Math.random() - 0.5) * k, H / 2 + (Math.random() - 0.5) * k); ctx.rotate(roll);
  drawWorld();
  ctx.restore();
  if (flash > 0 && !reduceMotion) { ctx.globalAlpha = flash * 0.35; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  drawOverlay(); drawHUD(); drawControls();
}

/* ---------- tuning panel ---------- */
const tunePanel = document.getElementById('tune'), tuneRows = document.getElementById('tune-rows');
let tuneOpen = false;
const tuneFmt = (d, v) => v.toFixed(d.step < 0.1 ? 2 : 1);
function saveTune() { try { localStorage.setItem('doomsday-tune', JSON.stringify(TUNE)); } catch (_) {} }
TUNE_DEFS.forEach(d => {
  const row = document.createElement('label'); row.className = 'trow'; row.htmlFor = 'tune-' + d.k;
  const name = document.createElement('span'); name.textContent = d.label;
  const out = document.createElement('output'); out.className = 'tval'; out.id = 'tune-' + d.k + '-val';
  const hint = document.createElement('span'); hint.className = 'thint'; hint.textContent = d.hint;
  const inp = document.createElement('input'); inp.type = 'range'; inp.id = 'tune-' + d.k;
  inp.min = d.min; inp.max = d.max; inp.step = d.step; inp.value = TUNE[d.k]; out.textContent = tuneFmt(d, TUNE[d.k]);
  inp.addEventListener('input', () => { TUNE[d.k] = parseFloat(inp.value); out.textContent = tuneFmt(d, TUNE[d.k]); saveTune(); });
  d.inp = inp; d.out = out; row.append(name, out, hint, inp); tuneRows.appendChild(row);
});
document.getElementById('tune-reset').addEventListener('click', () => {
  TUNE_DEFS.forEach(d => { TUNE[d.k] = d.def; d.inp.value = d.def; d.out.textContent = tuneFmt(d, d.def); }); saveTune();
});
document.getElementById('tune-done').addEventListener('click', closeTune);
function openTune() { tuneOpen = true; tunePanel.hidden = false; if (state === 'play') paused = true; }
function closeTune() { tuneOpen = false; tunePanel.hidden = true; cv.focus({ preventScroll: true }); }

/* ---------- loop and boot ---------- */
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000) || 0); last = t;
  if (!paused) update(dt);
  if (ac && humG) {
    const live = state === 'play' && !paused;
    humG.gain.setTargetAtTime(live ? 0.07 : 0, ac.currentTime, 0.08);
    hum.frequency.setTargetAtTime(50 + speed * 2.2, ac.currentTime, 0.1);
  }
  render();
  requestAnimationFrame(frame);
}
function start(d) {
  resize();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  try { new ResizeObserver(resize).observe(cv); } catch (_) {}
  attract();
  if (d && d.best) best = Math.max(best, d.best);
  if (d && d.playing) { score = d.score || 0; shield = d.shield || 100; startLevel(d.level || 1); paused = true; }
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
try { hot && hot.snapshot && hot.snapshot(() => ({ best, playing: state === 'play' || state === 'clear', level, score: Math.floor(score), shield })); } catch (_) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
