<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doomsday Tunnels</title>
<meta name="description" content="A tunnel flyer for phones. Steer, shoot and boost through twisting 3D tunnels before the countdown hits zero.">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doomsday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="fonts/ShareTechMono-Regular.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/Syncopate-Bold.woff" as="font" type="font/woff" crossorigin>
<style>
/* Layout: one full-bleed canvas. The game always plays landscape and draws its own HUD and thumb controls. */
:root{
  color-scheme: dark;
  --void:#07060f; --ink:#e8f1ff; --dim:#8a94b3;
  --warn:#ff4a2e; --gate:#ffe14a; --pick:#ffffff;
  --s1:#35d9ff; --s2:#b07cff; --s3:#4dffa6; --s4:#ff6ad5; --s5:#5b8cff;
  --display:"Syncopate","Arial Black",sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--mono);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#game{display:block;width:100%;height:100%;touch-action:none;outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#probe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
#tune,#post{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--void) 80%,transparent)}
#tune.rot,#post.rot{transform:translate(-50%,-50%) rotate(90deg)}
.tcard{container-type:inline-size;width:min(780px,100%);max-height:100%;overflow:auto;box-sizing:border-box;
  border:1px solid var(--dim);background:var(--void);padding:10px 18px 12px;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.thead h2{margin:0;font:700 14px var(--display);letter-spacing:.08em}
.tctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px}
.tseg{display:inline-flex}
.tctl button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:7px 14px;min-height:36px;cursor:pointer}
.tctl button[aria-pressed="true"]{background:var(--ink);color:var(--void)}
.tseg button+button{border-left:0}
.tchk{display:inline-flex;align-items:center;gap:7px;min-height:36px}
.tchk input{width:20px;height:20px;margin:0;accent-color:var(--s1)}
.tchk:has(input:disabled){color:var(--dim)}
#ctl-note{margin:0;color:var(--dim);font-size:11px;min-height:1.3em}
#tune-rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 22px}
@container (max-width:640px){#tune-rows{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (max-width:430px){#tune-rows{grid-template-columns:minmax(0,1fr)}}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;font-size:13px}
.thint{grid-column:1/-1;color:var(--dim);font-size:11px}
.tcard.pcard{width:min(460px,100%);gap:12px}
.prow{display:flex;flex-direction:column;gap:6px;font-size:13px}
.prow input{font:inherit;font-size:18px;letter-spacing:.06em;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:0;
  padding:9px 12px;min-height:44px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.prow input:focus-visible{outline:2px solid var(--gate);outline-offset:2px}
#post-note{margin:0;color:var(--dim);font-size:12px;min-height:2.8em}
#post-send{background:var(--ink);color:var(--void)}
#post-send:disabled{opacity:.5}
.trow input{grid-column:1/-1;width:100%;height:28px;margin:0;accent-color:var(--s1)}
.tval{font-variant-numeric:tabular-nums;color:var(--s1)}
.tfoot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.tfoot button{font:inherit;font-size:13px;letter-spacing:.06em;color:var(--ink);background:transparent;
  border:1px solid var(--ink);padding:7px 16px;min-height:36px;cursor:pointer}
#tune-done{background:var(--ink);color:var(--void)}
.tfoot button:focus-visible,.trow input:focus-visible,.tctl button:focus-visible,.tchk input:focus-visible{outline:2px solid var(--gate);outline-offset:2px}

@font-face{font-family:"Share Tech Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ShareTechMono-Regular.woff) format("woff")}
@font-face{font-family:"Syncopate";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/Syncopate-Bold.woff) format("woff")}
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:var(--void)}
</style>
</head>
<body>
<h1 class="sr">Doomsday Tunnels</h1>
<p class="sr">A wireframe tunnel flying game. Steer through the tunnel, dodge red walls, shoot yellow gates and mines, collect white cells, and reach the end of each sector before the countdown hits zero.</p>
<canvas id="game" tabindex="0" aria-label="Doomsday Tunnels game screen"></canvas>
<div id="probe"></div>
<div id="post" hidden>
  <form class="tcard pcard" id="post-form" role="dialog" aria-modal="true" aria-labelledby="post-title" autocomplete="off">
    <div class="thead"><h2 id="post-title">POST YOUR SCORE</h2><output class="tval" id="post-score"></output></div>
    <label class="prow" for="post-name">Name for the scoreboard
      <input id="post-name" name="name" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="send" required></label>
    <p id="post-note" role="status"></p>
    <div class="tfoot"><button type="button" id="post-cancel">Cancel</button><button type="submit" id="post-send">Post score</button></div>
  </form>
</div>
<div id="tune" hidden>
  <div class="tcard" role="dialog" aria-modal="true" aria-labelledby="tune-title">
    <div class="thead"><h2 id="tune-title">CONTROLS AND FEEL</h2>
      <div class="tfoot"><button type="button" id="tune-reset">Reset sliders</button><button type="button" id="tune-done">Done</button></div></div>
    <div class="tctl" role="group" aria-label="Steering">
      <span>Steering</span>
      <span class="tseg"><button type="button" id="ctl-stick" aria-pressed="true">Thumb stick</button><button type="button" id="ctl-tilt" aria-pressed="false">Tilt phone</button></span>
      <label class="tchk" for="ctl-invert"><input type="checkbox" id="ctl-invert"> Invert tilt up/down</label>
    </div>
    <p id="ctl-note" role="status"></p>
    <div id="tune-rows"></div>
  </div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const probe = document.getElementById('probe');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = { void: tok('--void'), ink: tok('--ink'), dim: tok('--dim'), warn: tok('--warn'),
  gate: tok('--gate'), pick: tok('--pick'), sectors: [1,2,3,4,5].map(i => tok('--s' + i)) };

const rgba = (c, a) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';

  return { line: mix(a, RGB.white, k > 0 ? 0.25 : 0.45), bright: mix(a, RGB.white, 0.8),
    floorA: d(0.24), floorB: d(0.56), ceilA: d(0.4), ceilB: d(0.66), wallA: d(0.34), wallB: d(0.62),

const makePalette = n => paletteFrom(RGB.sectors[(n - 1) % 5]);
try { document.fonts.load('700 20px Syncopate'); document.fonts.load('20px "Share Tech Mono"'); } catch (_) {}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- feel tuning (adjustable from the TUNE panel) ---------- */

  { k: 'steer', label: 'Steering speed', hint: 'How fast the ship slides sideways', min: 1.4, max: 4.4, step: 0.1, def: 2.6 },
  { k: 'snap',  label: 'Steering snap',  hint: 'Lower is smoother, higher snappier', min: 2, max: 12, step: 0.5, def: 4.5 },
  { k: 'speed', label: 'Flight speed',   hint: 'Forward speed through the tunnel', min: 0.6, max: 1.4, step: 0.05, def: 1 },
  { k: 'pull',  label: 'Curve pull',     hint: 'How hard bends push you outward', min: 0, max: 0.4, step: 0.01, def: 0.14 },
  { k: 'twist', label: 'Tunnel twist',   hint: 'How sharply the tunnel bends', min: 0, max: 1.5, step: 0.05, def: 0.7 },
  { k: 'sway',  label: 'Camera sway',    hint: 'Banking and shake on impacts', min: 0, max: 1.5, step: 0.05, def: 0.4 },
  { k: 'tilt',  label: 'Tilt range',     hint: 'Degrees of tilt for full steering', min: 8, max: 35, step: 1, def: 18 }

const TUNE = {}; TUNE_DEFS.forEach(d => { TUNE[d.k] = d.def; });
try { const sv = JSON.parse(localStorage.getItem('doomsday-tune') || '{}');
  TUNE_DEFS.forEach(d => { if (typeof sv[d.k] === 'number' && isFinite(sv[d.k])) TUNE[d.k] = clamp(sv[d.k], d.min, d.max); }); } catch (_) {}

/* ---------- tilt steering ---------- */
// In tilt mode the phone's tilt steers the ship and the thumb stick aims the guns instead.
const ctl = { mode: 'stick', invertY: false };
try { const sv = JSON.parse(localStorage.getItem('doomsday-ctl') || '{}'); if (sv.mode === 'tilt') ctl.mode = 'tilt'; ctl.invertY = !!sv.invertY; } catch (_) {}

let aimSX = 0, aimSY = 0;
function onOrient(e) {

  const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b), uz = Math.cos(b) * Math.cos(g);

  try { ang = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0); } catch (_) {}
  ang = (((Math.round(ang / 90) * 90 + (rot ? 90 : 0)) % 360) + 360) % 360;
  let ur, uu;                                    // "up" measured along the game picture's right and up directions
  if (ang === 0) { ur = ux; uu = uy; } else if (ang === 90) { ur = -uy; uu = ux; } else if (ang === 180) { ur = -ux; uu = -uy; } else { ur = uy; uu = -ux; }

  tilt.pitch = Math.atan2(uz, uu);               // 0 when the screen is upright, a quarter turn when it lies flat

}
function enableTilt() {                          // call from inside a tap: iPhones ask for motion access
  if (tilt.listening || tilt.denied) return;
  const D = window.DeviceOrientationEvent; if (!D) return;
  const listen = () => { if (tilt.listening) return; window.addEventListener('deviceorientation', onOrient); tilt.listening = true; tilt.t0 = performance.now(); };
  if (typeof D.requestPermission === 'function') {
    try { D.requestPermission().then(r => { if (r === 'granted') listen(); else tilt.denied = true; }).catch(() => {}); } catch (_) {}
  } else listen();
}
const tiltActive = () => ctl.mode === 'tilt' && tilt.ok && performance.now() - tilt.lastT < 1500;
function tiltStatus() {                          // 'on' | 'wait' | 'denied' | 'none'
  if (tilt.denied) return 'denied';
  if (!window.DeviceOrientationEvent) return 'none';
  if (tiltActive()) return 'on';
  if (tilt.listening && performance.now() - tilt.t0 > 2000) return 'none';
  return 'wait';
}

/* ---------- view ---------- */
const HW = 1.3, HH = 0.85, SEG = 2, NR = 38, NEAR = 0.35, RNEAR = 0.06, DEPTH = NR * SEG;
let W = 800, H = 400, SW = 800, dpr = 1, rot = false, u = 1, padL = 0, padR = 0, focal = 340, focal0 = 340, boostEase = 0;
let touchUI = matchMedia('(pointer: coarse)').matches;
const fireBtn = {x:0,y:0,r:0}, boostBtn = {x:0,y:0,r:0}, pauseBtn = {x:0,y:0,r:0}, muteBtn = {x:0,y:0,r:0}, tuneBtn = {x:0,y:0,r:0}, scoresBtn = {x:0,y:0,r:0};
function resize() {
  const r = cv.getBoundingClientRect();
  const sw = Math.max(1, r.width), sh = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  SW = sw;
  rot = sh > sw * 1.05 && touchUI;           // portrait phone: draw the game sideways
  W = rot ? sh : sw; H = rot ? sw : sh;
  u = clamp(H / 400, 0.75, 1.7);
  focal0 = Math.min(H * 0.85, W * 0.5); focal = focal0 * (1 - (reduceMotion ? 0 : 0.1) * boostEase);
  const ps = getComputedStyle(probe);
  padL = rot ? 0 : (parseFloat(ps.paddingLeft) || 0);
  padR = rot ? 0 : (parseFloat(ps.paddingRight) || 0);
  fireBtn.x = W - padR - 82 * u; fireBtn.y = H - 84 * u; fireBtn.r = 46 * u;
  boostBtn.x = W - padR - 186 * u; boostBtn.y = H - 54 * u; boostBtn.r = 34 * u;
  pauseBtn.x = W - padR - 34 * u; pauseBtn.y = 30 * u; pauseBtn.r = 20 * u;
  muteBtn.x = W - padR - 84 * u; muteBtn.y = 30 * u; muteBtn.r = 20 * u;
  tuneBtn.x = W - padR - 134 * u; tuneBtn.y = 30 * u; tuneBtn.r = 20 * u;
  const tp = document.getElementById('tune');
  tp.style.width = W + 'px'; tp.style.height = H + 'px'; tp.classList.toggle('rot', rot);
  const pp = document.getElementById('post');
  pp.style.width = W + 'px'; pp.style.height = H + 'px'; pp.classList.toggle('rot', rot);
  scoresBtn.x = W - padR - 184 * u; scoresBtn.y = 30 * u; scoresBtn.r = 20 * u;
  aboutLink.x = padL + 16 * u; aboutLink.y = H - 20 * u;
}
function baseTransform() {
  if (rot) ctx.setTransform(0, dpr, -dpr, 0, SW * dpr, 0);
  else ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function toLogical(e) {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  return rot ? [y, r.width - x] : [x, y];
}
const hit = (b, x, y, k) => Math.hypot(x - b.x, y - b.y) < b.r * (k || 1.2);
const ABOUT = 'about/';                               // address of the manual page; empty hides the title-screen link (the hosted game sets it)
const aboutLink = { x: 0, y: 0, w: 0 };        // bottom-left of the title screen; width is measured when it is drawn
const inAbout = (x, y) => x < aboutLink.x + aboutLink.w + 16 * u && y > aboutLink.y - 24 * u;

/* ---------- audio ---------- */
let ac = null, master = null, hum = null, humG = null, noiseBuf = null, muted = false;

    const put = (o, t) => { for (let i = 0; i < t.length; i++) buf[o + i] = t.charCodeAt(i); };
    put(0, 'RIFF'); dv.setUint32(4, 36 + n, true); put(8, 'WAVEfmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true); dv.setUint32(24, 8000, true); dv.setUint32(28, 8000, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);

function tone(type, f0, f1, dur, vol, delay) {

const sfx = {
  laser: () => tone('square', 900, 180, 0.09, 0.07),
  boom:  () => { noise(0.35, 0.5, 900); tone('sawtooth', 140, 40, 0.3, 0.2); },
  hit:   () => { noise(0.25, 0.6, 500); tone('sawtooth', 110, 35, 0.25, 0.3); },
  tink:  () => tone('triangle', 1400, 900, 0.05, 0.12),
  pick:  () => { tone('sine', 660, 660, 0.08, 0.2); tone('sine', 990, 990, 0.12, 0.2, 0.08); },
  scrape:() => noise(0.08, 0.2, 2500),
  clear: () => [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.14, 0.1, i * 0.11)),
  beep:  () => tone('square', 1200, 1200, 0.06, 0.09),
  boostOn:  () => { noise(0.5, 0.35, 1800); tone('sawtooth', 90, 340, 0.45, 0.16); },
  boostOff: () => tone('sawtooth', 260, 80, 0.3, 0.09),
  boostDry: () => { tone('square', 150, 110, 0.07, 0.1); tone('square', 150, 110, 0.07, 0.1, 0.11); },
  refuel:   () => [440, 660, 880, 1320].forEach((f, i) => tone('triangle', f, f, 0.09, 0.14, i * 0.06))
};
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

/* ---------- cut scenes: playback ---------- */
const scene = { shots: null, i: 0, line: 0, t: 0, lt: 0, typed: 0, done: null, wrapKey: '', wrap: [], fs: 16 };
const CPS = 40;

function lineEnter() { scene.lt = 0; scene.typed = 0; const f = curLine().fx; if (f && sfxScene[f]) sfxScene[f](); }

function playScene(shots, done) {
  scene.shots = shots; scene.i = 0; scene.done = done; state = 'scene'; stateT = 0; paused = false;
  stick.id = null; fireId = null; boostId = null; shotEnter();
}
function endScene() { const d = scene.done; scene.shots = null; scene.done = null; if (d) d(); }
function sceneAdvance() {

  if (scene.line < sh.lines.length - 1) { scene.line++; lineEnter(); }
  else if (scene.i < scene.shots.length - 1) { scene.i++; shotEnter(); }

}
const skipRect = () => ({ x: W - padR - 100 * u, y: 12 * u, w: 86 * u, h: 34 * u });
function sceneTap(x, y) {
  const b = skipRect();
  if (x > b.x - 10 * u && x < b.x + b.w + 10 * u && y < b.y + b.h + 12 * u) endScene(); else sceneAdvance();
}
function updateScene(dt) {

  const ln = curLine(), n = Math.min(ln.text.length, Math.floor(scene.lt * CPS));
  if (n > scene.typed) { if (n % 3 === 0 && ln.text[n - 1] !== ' ' && scene.lt < 1e3) { const p = WHO[ln.who].pitch; tone('square', p, p * 0.96, 0.035, 0.035); } scene.typed = n; }
}
function wrapLines(text, maxW, fs) {
  ctx.font = fs + 'px ' + FONT_M;

  if (cur) out.push(cur);
  return out;
}
function drawScene() {
  const sh = scene.shots[scene.i], ln = curLine(), who = WHO[ln.who];
  const dh = Math.round(Math.max(88 * u, H * 0.27)), ph = H - dh, typing = scene.lt * CPS < ln.text.length;
  VH = clamp(Math.round(VW * ph / W), 96, 180);
  if (scv.width !== VW || scv.height !== VH) { scv.width = VW; scv.height = VH; }
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.globalAlpha = 1; sg.globalCompositeOperation = 'source-over';
  PAINT[sh.bg](scene.t, ln.who, typing, sh, ln);

  ctx.fillStyle = C.void; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(scv, px0, py0, pw, pxh); ctx.imageSmoothingEnabled = true;

  if (!reduceMotion) { ctx.globalAlpha = 0.07; ctx.fillStyle = C.ink; ctx.fillRect(px0, py0 + ((scene.t * 0.23) % 1) * (pxh + 40) - 30, pw, 10 * u); }
  if (scene.t < 0.22 && !reduceMotion) { ctx.globalAlpha = (1 - scene.t / 0.22) * 0.85; ctx.fillStyle = C.ink; ctx.fillRect(px0, py0, pw, pxh); }
  ctx.globalAlpha = 1; ctx.textBaseline = 'top';
  const tt = Math.floor(stateT), lx = px0 + padL + 14 * u;
  txt('PLAY ►', lx, py0 + 12 * u, FONT_M, 14 * u, C.ink);
  txt('SP  0:' + String(Math.floor(tt / 60)).padStart(2, '0') + ':' + String(tt % 60).padStart(2, '0'), lx, py0 + pxh - 24 * u, FONT_M, 12 * u, C.ink);
  const b = skipRect();
  ctx.globalAlpha = 0.5; ctx.fillStyle = C.void; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.globalAlpha = 1;
  ctx.strokeStyle = C.ink; ctx.lineWidth = u; ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.textBaseline = 'middle'; txt('SKIP ►►', b.x + b.w / 2, b.y + b.h / 2, FONT_M, 12 * u, C.ink, 'center');

  const key = scene.i + ':' + scene.line + ':' + Math.round(W) + ':' + Math.round(H);
  if (scene.wrapKey !== key) {
    let fs = 16 * u, lines;
    do { lines = wrapLines(ln.text, x1 - x0, fs); if (lines.length * fs * 1.35 <= dh - 36 * u) break; fs *= 0.9; } while (fs > 9);

/* ---------- online: global scoreboard and anonymous play counts ---------- */
// The game sends its server two kinds of thing, and nothing else:
//   - play counts: "a run started" and "a run ended in sector N after S seconds". No identifier of
//     any kind goes with them. So the server can count players per day, the game remembers, on this
//     device only, which day it last played, and says just "first play today: yes or no".
//   - a score with the name typed in, and only when the player chooses to post it.
// If the browser asks not to be tracked, play counts are not recorded at all.
const API = 'https://doomsday-tunnels-api.acechase.workers.dev';                                // scoreboard server address; empty switches all of this off
const optedOut = navigator.doNotTrack === '1' || navigator.globalPrivacyControl === true;

const board = { open: false, rows: null, failed: false, me: '' };
let postOpen = false;
try { board.me = localStorage.getItem('doomsday-name') || ''; } catch (_) {}
function apiCall(path, body) {
  const opt = body ? { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body), keepalive: true } : {};
  return fetch(API + path, opt).then(r => r.json().then(j => ({ ok: r.ok, status: r.status, j }), () => ({ ok: false, status: r.status, j: {} })));
}
function runStarted() {
  if (!API) return;
  Object.assign(online, { token: null, t0: performance.now(), ended: false, posted: false, rank: 0 });
  const day = new Date().toISOString().slice(0, 10); let firstToday = false, firstEver = false;
  try { const last = localStorage.getItem('doomsday-day'); firstToday = last !== day; firstEver = !last; localStorage.setItem('doomsday-day', day); } catch (_) {}
  apiCall('/event', { t: 'start', count: !optedOut, firstToday, firstEver, touch: touchUI, tilt: ctl.mode === 'tilt' })
    .then(r => { if (r.ok) online.token = r.j.token; }).catch(() => {});
}
function runEnded(leaving) {
  if (!API || online.ended || !online.token) return;
  online.ended = true;
  const body = { t: 'end', count: !optedOut, token: online.token, sector: level, cleared: level - 1, secs: Math.round((performance.now() - online.t0) / 1000) };
  try { if (leaving && navigator.sendBeacon) navigator.sendBeacon(API + '/event', JSON.stringify(body)); else apiCall('/event', body).catch(() => {}); } catch (_) {}
}
window.addEventListener('pagehide', () => runEnded(true));

function openBoard(rows) {
  if (!API) return;

  if (!rows) apiCall('/scores').then(r => { if (r.ok) board.rows = r.j.top; else board.failed = true; }).catch(() => { board.failed = true; });
}
function drawBoard() {
  const cx = W / 2, n = 10, rowH = 22 * u, top = H / 2 - n * rowH / 2 + 4 * u;

  txt('HIGH SCORES', cx, top - 32 * u, FONT_D, 20 * u, lv.color, 'center');
  if (!board.rows) txt(board.failed ? 'THE SCOREBOARD IS NOT ANSWERING. TRY AGAIN LATER.' : 'LOADING...', cx, H / 2, FONT_M, 14 * u, C.dim, 'center');
  else if (!board.rows.length) txt('NO SCORES YET. BE THE FIRST.', cx, H / 2, FONT_M, 14 * u, C.ink, 'center');
  else {

}

  if (!name || postSend.disabled) return;
  postSend.disabled = true; postNote.textContent = 'Posting...';
  apiCall('/scores', { name, score: Math.floor(score), sector: level, token: online.token }).then(r => {
    if (r.ok) {
      online.posted = true; online.rank = r.j.rank; board.me = r.j.name;
      try { localStorage.setItem('doomsday-name', r.j.name); } catch (_) {}
      closePost(); openBoard(r.j.top); sfx.clear();
    } else {
      postSend.disabled = false;
      postNote.textContent = r.status === 422 && r.j.error === 'name' ? r.j.message : r.status === 429 ? 'Too many tries. Wait a minute, then post again.' : 'That score could not be posted.';
    }
  }).catch(() => { postSend.disabled = false; postNote.textContent = 'Could not reach the scoreboard. Check your connection, then post again.'; });
});

/* ---------- loop and boot ---------- */
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - last) / 1000) || 0); last = t;
  if (!paused) update(dt);
  if (tuneOpen) refreshCtl();
  if (ac && humG) {
    const live = state === 'play' && !paused;
    humG.gain.setTargetAtTime(live ? 0.07 + 0.09 * boostEase : 0, ac.currentTime, 0.08);
    hum.frequency.setTargetAtTime(50 + speed * 2.2 + 50 * boostEase, ac.currentTime, 0.1);
  }
  render();
  requestAnimationFrame(frame);
}
function start(d) {
  resize();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  try { new ResizeObserver(resize).observe(cv); } catch (_) {}
  attract();
  if (d && d.best) best = Math.max(best, d.best);
  if (d && d.playing) { score = d.score || 0; shield = d.shield || 100; lives = typeof d.lives === 'number' ? d.lives : START_SPARES; startLevel(d.level || 1); paused = true; }
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
try { hot && hot.snapshot && hot.snapshot(() => ({ best, playing: state === 'play' || state === 'clear' || state === 'respawn', level, score: Math.floor(score), shield, lives })); } catch (_) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
